services:
  devdraw-api:
    image: gustavodamassa/devdraw-api:latest
    container_name: devdraw-api
    env_file:
      - .env
    environment:
      PORT: 8080
      DATABASE_HOST: devdraw-postgres
      DATABASE_PORT: 5432
    depends_on:
      - devdraw-postgres
    restart: unless-stopped

  devdraw-postgres:
    image: postgres:16
    container_name: devdraw-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - devdraw-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  devdraw-nginx:
    image: nginx:alpine
    container_name: devdraw-nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - devdraw-api
    restart: unless-stopped

  devdraw-watchtower:
    image: containrrr/watchtower
    container_name: devdraw-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 devdraw-api
    restart: unless-stopped

volumes:
  devdraw-postgres-data:
